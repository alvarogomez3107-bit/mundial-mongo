<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscribir Club | Mundial JPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
            min-height: 100vh; 
            padding: 40px 15px; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            color: #1f2937;
        }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: slideUpFade 0.5s ease-out forwards;
        }
        .section-header {
            color: #065f46;
            font-weight: 700;
            border-bottom: 2px solid #ecfdf5;
            padding-bottom: 8px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #d1d5db;
            padding: 10px 14px;
            transition: all 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .btn-glass {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            transition: all 0.3s;
            font-weight: 600;
        }
        .btn-glass:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); 
            color: white; 
        }
        .box-sub {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="glass-panel p-4 p-md-5">
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-1 rounded-pill fw-semibold">
                                Formulario JPA
                            </span>
                            <h2 class="fw-bold mt-2 mb-0" style="color: #065f46;">Inscripción de Club</h2>
                        </div>
                        <a th:href="@{/listar}" class="btn btn-outline-secondary rounded-pill px-3">
                            <i class="bi bi-arrow-left me-1"></i> Volver
                        </a>
                    </div>

                    <form th:action="@{/guardar}" th:object="${club}" method="post">
                        
                        <!-- 1. Datos del Club -->
                        <div class="mb-4">
                            <div class="section-header">
                                <span><i class="bi bi-shield-shaded me-2 text-success"></i>1. Datos del Club</span>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre del Club</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Boca Juniors, Liverpool FC..." required>
                            </div>
                        </div>

                        <!-- 2. Relación @OneToOne: Entrenador -->
                        <div class="mb-4">
                            <div class="section-header">
                                <span><i class="bi bi-person-badge me-2 text-info"></i>2. Entrenador Técnico</span>
                                <span class="badge bg-info-subtle text-info border">@OneToOne</span>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Nombre</label>
                                    <input type="text" th:field="*{entrenador.nombre}" class="form-control" placeholder="Nombre" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Apellido</label>
                                    <input type="text" th:field="*{entrenador.apellido}" class="form-control" placeholder="Apellido" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Edad</label>
                                    <input type="number" th:field="*{entrenador.edad}" class="form-control" placeholder="Edad" min="20" max="90" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Nacionalidad</label>
                                    <input type="text" th:field="*{entrenador.nacionalidad}" class="form-control" placeholder="Ej. Argentina, Española..." required>
                                </div>
                            </div>
                        </div>

                        <!-- 3. Relación @ManyToOne: Asociación -->
                        <div class="mb-4">
                            <div class="section-header">
                                <span><i class="bi bi-globe2 me-2 text-primary"></i>3. Asociación Afiliada</span>
                                <span class="badge bg-primary-subtle text-primary border">@ManyToOne</span>
                            </div>
                            <label class="form-label small fw-semibold">Selecciona la Federación o Asociación</label>
                            <select name="asociacionId" class="form-select" required>
                                <option value="" disabled selected>-- Elige una Asociación --</option>
                                <option th:each="asoc : ${asociaciones}" 
                                        th:value="${asoc.id}" 
                                        th:text="${asoc.siglas + ' - ' + asoc.nombre + ' (' + asoc.pais + ')'}">
                                    FCF - Federación Colombiana
                                </option>
                            </select>
                        </div>

                        <!-- 4. Relación @OneToMany: Plantel de Jugadores -->
                        <div class="mb-4">
                            <div class="section-header">
                                <span><i class="bi bi-people-fill me-2 text-success"></i>4. Jugadores Iniciales</span>
                                <span class="badge bg-success-subtle text-success border">@OneToMany</span>
                            </div>
                            
                            <!-- Jugador 1 -->
                            <div class="box-sub mb-3">
                                <h6 class="fw-bold text-muted mb-2">Jugador 1</h6>
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <input type="text" th:field="*{jugadores[0].nombre}" class="form-control form-control-sm" placeholder="Nombre (ej. Lionel)">
                                    </div>
                                    <div class="col-md-4">
                                        <input type="text" th:field="*{jugadores[0].apellido}" class="form-control form-control-sm" placeholder="Apellido (ej. Messi)">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="number" th:field="*{jugadores[0].numero}" class="form-control form-control-sm" placeholder="Dorsal" min="1" max="99">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="text" th:field="*{jugadores[0].posicion}" class="form-control form-control-sm" placeholder="Posición">
                                    </div>
                                </div>
                            </div>

                            <!-- Jugador 2 -->
                            <div class="box-sub">
                                <h6 class="fw-bold text-muted mb-2">Jugador 2 (Opcional)</h6>
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <input type="text" th:field="*{jugadores[1].nombre}" class="form-control form-control-sm" placeholder="Nombre">
                                    </div>
                                    <div class="col-md-4">
                                        <input type="text" th:field="*{jugadores[1].apellido}" class="form-control form-control-sm" placeholder="Apellido">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="number" th:field="*{jugadores[1].numero}" class="form-control form-control-sm" placeholder="Dorsal" min="1" max="99">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="text" th:field="*{jugadores[1].posicion}" class="form-control form-control-sm" placeholder="Posición">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 5. Relación @ManyToMany: Competiciones -->
                        <div class="mb-5">
                            <div class="section-header">
                                <span><i class="bi bi-trophy-fill me-2 text-warning"></i>5. Competiciones Participantes</span>
                                <span class="badge bg-warning-subtle text-dark border">@ManyToMany</span>
                            </div>
                            <div class="row g-2">
                                <div class="col-md-6" th:each="comp : ${competicionesDisponibles}">
                                    <div class="form-check p-3 rounded-3 border bg-light d-flex align-items-center">
                                        <input class="form-check-input ms-0 me-3" 
                                               type="checkbox" 
                                               name="competicionesIds" 
                                               th:value="${comp.id}" 
                                               th:id="${'comp_' + comp.id}">
                                        <label class="form-check-label w-100 fw-semibold text-dark cursor-pointer" th:for="${'comp_' + comp.id}">
                                            <span th:text="${comp.nombre}">Copa Libertadores</span>
                                            <small class="text-muted d-block fw-normal">Premio: $<span th:text="${#numbers.formatDecimal(comp.montoPremio, 0, 'COMMA', 0, 'POINT')}">18,000,000</span> USD</small>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-glass btn-lg">
                                <i class="bi bi-check-circle me-1"></i> Guardar Club y Relaciones
                            </button>
                            <a th:href="@{/listar}" class="btn btn-light btn-lg text-secondary border">
                                Cancelar y Ver Listado
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
